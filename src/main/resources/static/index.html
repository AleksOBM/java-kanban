<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

    <!-- Навигация -->
    <nav class="navbar">
        <div class="container">
            <h1 class="navbar-brand">📋 Task Tracker</h1>
            <div class="nav-links">
                <button class="nav-link active" data-page="kanban">📌 Доска</button>
                <button class="nav-link" data-page="tasks">Задачи</button>
                <button class="nav-link" data-page="subtasks">Сабтаски</button>
                <button class="nav-link" data-page="epics">Эпики</button>
                <button class="nav-link" data-page="history">История</button>
                <button class="nav-link" data-page="prioritized">Приоритеты</button>
            </div>
        </div>
    </nav>

    <!-- Контент -->
    <main class="container">
        <div id="content">
            <div class="loading">Загрузка...</div>
        </div>
    </main>

    <!-- Модалка -->
    <div id="modal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="modal-close" title="Закрыть">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

</div>

<!-- Скрипты (порядок важен) -->
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/pages.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
